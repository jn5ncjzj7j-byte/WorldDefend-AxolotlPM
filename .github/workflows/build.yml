name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: phar
      - name: Check PHP syntax
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Build PHAR
        run: |
          mkdir -p build
          php -d phar.readonly=0 <<'PHP'
          <?php
          $root = getcwd();
          $output = $root . "/build/WorldDefendAxolotl.phar";
          $phar = new Phar($output);
          $phar->startBuffering();
          $phar->addFile($root . "/plugin.yml", "plugin.yml");
          foreach(["resources", "src"] as $directory){
              $iterator = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root . "/" . $directory, FilesystemIterator::SKIP_DOTS));
              foreach($iterator as $file){
                  if($file->isFile()){
                      $path = $file->getPathname();
                      $relative = substr($path, strlen($root) + 1);
                      $phar->addFile($path, $relative);
                  }
              }
          }
          $phar->setStub("<?php __HALT_COMPILER();");
          $phar->stopBuffering();
          if(!is_file($output) || filesize($output) === 0){
              fwrite(STDERR, "PHAR output missing or empty\n");
              exit(1);
          }
          echo "Built " . $output . " (" . filesize($output) . " bytes)\n";
          PHP
      - uses: actions/upload-artifact@v4
        with:
          name: WorldDefendAxolotl
          path: build/WorldDefendAxolotl.phar
          if-no-files-found: error
